name: Build and Release Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew || true

      - name: Build APK with Gradle
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK for release
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk IntervalTrack.apk

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: IntervalTrack v1.0.0 (Direct APK Install)
          body: |
            ### 📱 IntervalTrack Android App
            Tap **IntervalTrack.apk** below on your Android phone to download and install!
          files: IntervalTrack.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
